name: Build Pckt v1.0.9 APK (Instant Background SMS + Actionable Alerts + Polish · Flutter 3.47.9)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "21"
  TARGET_PLATFORM: "android-arm64"

jobs:
