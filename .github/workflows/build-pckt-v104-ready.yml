      - name: 3. Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 4. Set up Flutter 3.47.9 (Compatible with AGP 9.1.0 & Kotlin 2.4.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: 5. Fetch Packages & Generate Drift v6 Database Code
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: 6. Create Release Keystore & Run Analyzer + Unit Tests
        run: |
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass android123 -keypass android123 \
              -dname "CN=Pckt, OU=Dev, O=Pckt, L=Mumbai, S=MH, C=IN"
            cp upload-keystore.jks android/upload-keystore.jks
            cp upload-keystore.jks android/app/upload-keystore.jks
            printf "storePassword=android123\nkeyPassword=android123\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" | tee android/key.properties android/app/key.properties >/dev/null
          fi
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: 7. Build 64-Bit (arm64-v8a) Pckt v1.0.4 Release APK
        run: |
          mkdir -p dist_apk
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk dist_apk/pckt-v1.0.4-arm64.apk
          ls -lh dist_apk/

      - name: 8. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pckt-v1.0.4-arm64-APK
          path: dist_apk/pckt-v1.0.4-arm64.apk

      - name: 9. Publish Direct-Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.4-${{ github.run_number }}
          name: "Pckt v1.0.4 (All 7 New Upgrades + Schema v6 - arm64)"
          body: "Tap **`pckt-v1.0.4-arm64.apk`** below under **Assets** to download and install Pckt v1.0.4 directly on your phone."
          files: dist_apk/pckt-v1.0.4-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
