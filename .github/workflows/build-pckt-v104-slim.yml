          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Pckt v1.0.4 upgrades and clean workflow [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: 4. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 5. Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 6. Accept Android SDK Licenses & Configure Gradle Memory
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          kotlin.daemon.jvmargs=-Xmx2g
          EOF

      - name: 7. Restore or Create Persistent Signing Key
        uses: actions/cache@v4
        with:
          path: ~/pckt-signing
          key: pckt-signing-key-v1

      - name: 8. Prepare Release Signing
        run: |
          mkdir -p ~/pckt-signing
          KS="$HOME/pckt-signing/pckt.jks"
          PASS="pckt-sideload-key"
          ALIAS="pckt"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Pckt Sideload, OU=Dev, O=Pckt, C=IN"
          fi
          cat > android/key.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=$ALIAS
          storeFile=$KS
          EOF

      - name: 9. Fetch Flutter Packages & Generate Drift v6 Database
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: 10. Build Pckt v1.0.4 APK (${{ env.TARGET_PLATFORM }})
        run: |
          set -o pipefail
          : > build.log
          for attempt in 1 2; do
            echo "=== build attempt $attempt ===" | tee -a build.log
            if flutter build apk --release --target-platform "$TARGET_PLATFORM" --no-tree-shake-icons 2>&1 | tee -a build.log; then
              break
            fi
            [ "$attempt" = "2" ] && exit 1
            echo "Retrying build once..."
            sleep 15
          done
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pckt-v1.0.4-arm64.apk
          ls -lh dist/

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pckt-v1.0.4-apk
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 12. Publish Direct-Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.4-${{ github.run_number }}
          name: "Pckt v1.0.4 (Schema v6, Bills History, Full Insights, Auto Backup)"
          body: |
            Pckt v1.0.4 complete build. Tap `pckt-v1.0.4-arm64.apk` under **Assets** below to download and install directly.
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
