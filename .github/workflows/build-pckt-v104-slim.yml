name: Build Pckt v1.0.4 APK (Slim Under-500KB + Flutter 3.47.9)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (3.47.9 = matches Pckt AGP 9.1.0)"
        required: true
        default: "3.47.9"
      target_platform:
        description: "CPU type"
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm,android-arm64,android-x64
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.9' }}
  TARGET_PLATFORM: ${{ inputs.target_platform || 'android-arm64' }}

jobs:
  build:
    name: Apply v1.0.4 Upgrades & Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Apply Pckt v1.0.4 Source Upgrades & Remove Old Workflows
        run: |
          if [ -f v104_upgrade.zip ]; then
            echo "Unpacking v104_upgrade.zip from repo root..."
            unzip -q -o v104_upgrade.zip
