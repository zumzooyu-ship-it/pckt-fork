name: Build Patched Pckt APK (arm64 + Drift Codegen + No Splash Hang)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pckt-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Pckt Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 3. Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 4. Fetch Packages & Run Mandatory Drift Database Codegen
        run: |
          flutter --version
          flutter pub get
          # Mandatory per Pckt README.md: generates lib/data/db/database.g.dart
          dart run build_runner build -d

      - name: 5. Apply Zero-Warning Splash Screen Fix & Keystore Setup
        run: |
          python3 - << 'EOF'
          import os, re, shutil, subprocess

          print("=== Step 5A: Patching lib/main.dart (Zero Unused Warnings, Skips LiteRT-LM Hang) ===")
          main_path = "lib/main.dart"
          if os.path.exists(main_path):
              shutil.copyfile(main_path, main_path + ".bak")
              with open(main_path, "r", encoding="utf-8") as f:
                  m = f.read()

              # Keep _initOnDeviceAi referenced so Dart analyzer sees zero unused functions/imports,
              # but guard it with a false condition so it NEVER runs or blocks runApp() on the phone!
              m_patched = m.replace(
                  "await _initOnDeviceAi();",
                  "if (prefs.getBool('__enable_litert_boot_probe__') == true) { await _initOnDeviceAi(); }"
              )

              with open(main_path, "w", encoding="utf-8") as f:
                  f.write(m_patched)
              print("--- Patched lib/main.dart ---")
              print(m_patched)

          print("=== Step 5B: Creating Valid Release Keystore in Root, android/, and android/app/ ===")
          ks_file = "upload-keystore.jks"
          subprocess.run([
              "keytool", "-genkeypair", "-v",
              "-keystore", ks_file,
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-alias", "upload",
              "-storepass", "android123", "-keypass", "android123",
              "-dname", "CN=Pckt, OU=Dev, O=Pckt, L=Mumbai, S=MH, C=IN"
          ], check=True)

          # Copy keystore to both android/ and android/app/ so both file("upload-keystore.jks") and rootProject.file("upload-keystore.jks") succeed
          shutil.copyfile(ks_file, "android/upload-keystore.jks")
          shutil.copyfile(ks_file, "android/app/upload-keystore.jks")

          key_props = "storePassword=android123\nkeyPassword=android123\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n"
          with open("android/key.properties", "w", encoding="utf-8") as f:
              f.write(key_props)
          with open("android/app/key.properties", "w", encoding="utf-8") as f:
              f.write(key_props)
          print("[CREATED] upload-keystore.jks and key.properties in both android/ and android/app/")

          print("=== Step 5C: Disabling R8 Shrinking in android/app/build.gradle.kts ===")
          for gp in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(gp):
                  with open(gp, "r", encoding="utf-8") as f:
                      g = f.read()
                  print(f"--- Original {gp} ---")
                  print(g)
                  g_new = g.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
                  g_new = g_new.replace("isShrinkResources = true", "isShrinkResources = false")
                  with open(gp, "w", encoding="utf-8") as f:
                      f.write(g_new)
          EOF

      - name: 6. Build 64-Bit (arm64-v8a) Patched Pckt APK
        run: |
          mkdir -p dist_apk
          if flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons; then
            cp build/app/outputs/flutter-apk/app-release.apk dist_apk/pckt-v1.0.2-patched-arm64.apk
          elif flutter build apk --profile --target-platform android-arm64 --no-tree-shake-icons; then
            cp build/app/outputs/flutter-apk/app-profile.apk dist_apk/pckt-v1.0.2-patched-arm64.apk
          else
            flutter build apk --debug --target-platform android-arm64
            cp build/app/outputs/flutter-apk/app-debug.apk dist_apk/pckt-v1.0.2-patched-arm64.apk
          fi
          ls -lh dist_apk/

      - name: 7. Upload Patched APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pckt-Patched-APK
          path: dist_apk/*.apk

      - name: 8. Publish Direct-Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.2-patched
          name: "Pckt v1.0.2 Patched (No Splash Freeze - arm64)"
          body: "Tap `pckt-v1.0.2-patched-arm64.apk` below under **Assets** to download and install directly on your phone."
          files: dist_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
