      - name: 3. Commit v1.0.8 Fixed Source Code Back to Your GitHub Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Pckt to v1.0.8 Fixed (Resolved Activity/Dashboard Bill Badges + All 8 Upgrades) [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: 4. Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 5. Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 6. Accept Android SDK Licenses & Configure Gradle Memory
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          kotlin.daemon.jvmargs=-Xmx2g
          EOF

      - name: 7. Restore or Create Persistent Signing Key
        uses: actions/cache@v4
        with:
          path: ~/pckt-signing
          key: pckt-signing-key-v1

      - name: 8. Prepare Release Signing
        run: |
          mkdir -p ~/pckt-signing
          KS="$HOME/pckt-signing/pckt.jks"
          PASS="pckt-sideload-key"
          ALIAS="pckt"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Pckt Sideload, OU=Dev, O=Pckt, C=IN"
          fi
          cat > android/key.properties <<EOF
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=$ALIAS
          storeFile=$KS
          EOF

      - name: 9. Fetch Flutter Packages & Generate Drift v6 Database
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: 10. Build Pckt v1.0.8 Fixed APK (${{ env.TARGET_PLATFORM }})
        run: |
          set -o pipefail
          : > build.log
          for attempt in 1 2; do
            echo "=== build attempt $attempt ===" | tee -a build.log
            if flutter build apk --release --target-platform "$TARGET_PLATFORM" --no-tree-shake-icons 2>&1 | tee -a build.log; then
              break
            fi
            [ "$attempt" = "2" ] && exit 1
            echo "Retrying build once..."
            sleep 15
          done
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pckt-v1.0.8-arm64.apk
          ls -lh dist/

      - name: 11. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pckt-v1.0.8-apk
          path: dist/pckt-v1.0.8-arm64.apk
          if-no-files-found: error
          retention-days: 90

      - name: 12. Publish Direct-Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.8
          name: "Pckt v1.0.8 (All-Time Bill Linking + Scan Preview + Teach Pckt Fixes + CSV Split Links + Recurring)"
          body: "Tap `pckt-v1.0.8-arm64.apk` below under **Assets** to download and install directly on your Android phone."
          files: dist/pckt-v1.0.8-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
